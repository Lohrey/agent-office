# Agent Office on any Docker host that already runs Traefik (a Hostinger "Docker and Traefik" VPS,
# say), on https://$AGENT_OFFICE_DOMAIN. Nothing is built ahead of time: the container clones the
# repository and builds the office on its first start (deploy/container/bootstrap.sh), so this file
# also works where Compose can't build images, like Hostinger's Docker Manager. docs/self-hosting.md
# has the details.
#
#   printf 'AGENT_OFFICE_DOMAIN=office.example.com\nAGENT_OFFICE_PASSWORD=%s\n' "$(openssl rand -base64 18)" >.env
#   chmod 600 .env; cat .env     # the office password: write it down
#   docker compose -f compose.yaml up -d
#
# Voice calls between networks that block direct connections (mobile, office and CGNAT ones) need
# a TURN relay. Add these two lines to .env and the turn service below starts too, on this host:
#
#   COMPOSE_PROFILES=turn
#   TURN_PASSWORD=<openssl rand -hex 16>
#
# It needs UDP and TCP 3478 and UDP 49160-49200 open in the server's firewall.
#
# Traefik needs its Docker provider on, an entrypoint for 443 and a certificate resolver; their
# names default to the ones Hostinger's template uses (websecure, web, letsencrypt).
services:
  office:
    image: node:22-bookworm
    restart: unless-stopped
    # Reaps what workers leave behind, as tini does in the image.
    init: true
    # Workers' terminals get a moment to save their sessions before the container goes.
    stop_grace_period: 30s
    # Cloned next to its final place and moved there, so a clone cut short is never mistaken for one.
    command:
      - bash
      - -c
      - >-
        set -e;
        [ -d /opt/agent-office ] || {
        rm -rf /opt/agent-office.tmp;
        git clone --depth 1 --branch '${AGENT_OFFICE_REF:-main}'
        '${AGENT_OFFICE_REPO:-https://github.com/AgentSystemLabs/agent-office.git}' /opt/agent-office.tmp;
        mv /opt/agent-office.tmp /opt/agent-office; };
        [ -x /opt/agent-office/deploy/container/bootstrap.sh ] || {
        echo 'agent-office: this branch has no deploy/container/bootstrap.sh; set AGENT_OFFICE_REPO and AGENT_OFFICE_REF';
        rm -rf /opt/agent-office; exit 1; };
        exec /opt/agent-office/deploy/container/bootstrap.sh
    environment:
      # Listen where Traefik reaches it. No AGENT_OFFICE_PUBLIC_HOST: the container's SSH isn't
      # published, so teammates come in by invite link (🔑 Accounts), not 👥 Invite teammates.
      - AGENT_OFFICE_BEHIND_PROXY=1
      # As in the image: workers' terminals speak UTF-8.
      - LANG=C.UTF-8
      # The rest come from the environment (or an .env file next to this one) when they're set.
      # The office password. Leave it out and set AGENT_OFFICE_CLAIM_TOKEN instead to have the office
      # make one and show it once, at https://$AGENT_OFFICE_DOMAIN/claim?t=<token>.
      - AGENT_OFFICE_PASSWORD
      - AGENT_OFFICE_CLAIM_TOKEN
      # Workers sign in to Claude with one of these instead of /login in the first one's terminal.
      - CLAUDE_CODE_OAUTH_TOKEN
      - ANTHROPIC_API_KEY
      # A GitHub token (repo, read:org, workflow) signs the office's GitHub CLI in, so it can clone
      # floors and open pull requests; without one, run gh auth login at a desk.
      - AGENT_OFFICE_GITHUB_TOKEN
      # TURN servers for voice, separated by spaces (turn:user:pass@host:port). With TURN_PASSWORD set,
      # the turn service below on this host, over UDP and TCP.
      - AGENT_OFFICE_TURN=${AGENT_OFFICE_TURN:-${TURN_PASSWORD:+turn:office:${TURN_PASSWORD:-}@${AGENT_OFFICE_DOMAIN}:3478 turn:office:${TURN_PASSWORD:-}@${AGENT_OFFICE_DOMAIN}:3478?transport=tcp}}
    volumes:
      - office-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.agent-office.rule=Host(`${AGENT_OFFICE_DOMAIN:?set AGENT_OFFICE_DOMAIN}`)
      - traefik.http.routers.agent-office.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.agent-office.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.agent-office.service=agent-office
      - traefik.http.services.agent-office.loadbalancer.server.port=4600
      # Plain http on the same name goes to https, where voice and screen sharing work.
      - traefik.http.routers.agent-office-http.rule=Host(`${AGENT_OFFICE_DOMAIN}`)
      - traefik.http.routers.agent-office-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}
      - traefik.http.routers.agent-office-http.middlewares=agent-office-https
      - traefik.http.middlewares.agent-office-https.redirectscheme.scheme=https
      - traefik.http.middlewares.agent-office-https.redirectscheme.permanent=true

  # A TURN relay (coturn) for voice, started with COMPOSE_PROFILES=turn. On the host's network, so the
  # relay ports it hands out are the server's own. It won't relay into private networks (the
  # containers next to it, the cloud's metadata address), only between the people in a call.
  turn:
    image: coturn/coturn:4.6
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    environment:
      - TURN_PASSWORD
    entrypoint:
      - sh
      - -c
      - >-
        [ -n "$$TURN_PASSWORD" ] || { echo 'turn: set TURN_PASSWORD'; exit 1; };
        exec turnserver -n --log-file=stdout --no-cli --no-tls --no-dtls --fingerprint --lt-cred-mech
        --realm='${AGENT_OFFICE_DOMAIN}' --user="office:$$TURN_PASSWORD"
        --listening-port=3478 --min-port=49160 --max-port=49200
        --no-multicast-peers --no-loopback-peers
        --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1 --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
        --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

volumes:
  office-data:
